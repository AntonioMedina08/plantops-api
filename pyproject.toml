[project]
name = "plantops-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antonio Medina", email = "AntonioMedinamj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plantops-api = "plantops_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort (orden de imports)
    "UP",     # pyupgrade (sintaxis moderna)
    "B",      # flake8-bugbear (bugs comunes)
    "SIM",    # flake8-simplify (código más limpio)
]
ignore = [
    "E501",   # line length → delegamos al formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
