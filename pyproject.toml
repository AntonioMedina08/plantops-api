[project]
name = "plantops-api"
version = "0.1.0"
description = "Industrial maintenance management (CMMS) backend API for asset tracking, fault reporting, and work orders."
readme = "README.md"
authors = [
    { name = "Antonio Medina", email = "AntonioMedinamj@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
plantops-api = "plantops_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern syntax)
    "B",      # flake8-bugbear (common bugs)
    "SIM",    # flake8-simplify (code simplification)
]
ignore = [
    "E501",   # line length -> delegated to formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
